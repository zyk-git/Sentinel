server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gift_ledger?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  admin:
    username: admin
    password: admin
  upload-dir: uploads
